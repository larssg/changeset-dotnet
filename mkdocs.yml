site_name: Changeset.NET
site_description: Ecto-style changesets for C# — cast, validate, and apply changes without exceptions.
repo_url: https://github.com/larssg/changeset-dotnet
repo_name: larssg/changeset-dotnet

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core Concepts:
      - The Changeset Lifecycle: lifecycle.md
      - Casting: casting.md
      - Validation: validation.md
      - Errors: errors.md
      - Applying Changes: applying-changes.md
      - Associations: associations.md
  - Integrations:
      - EF Core & ASP.NET Core: ef-core.md
      - Source Generator: source-generator.md
  - Recipes: recipes.md
  - API Reference: api-reference.md
  - Troubleshooting: troubleshooting.md
